[build-system]
build-backend = "setuptools.build_meta"
requires = [
  "setuptools",
  "setuptools-scm",
]

[project]
authors = [
  {email = "tangzy27@mail2.sysu.edu.cn", name = "Ziyi Tang"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
description = "QuantaAlpha - 天然气市场需求预测（智能体 + 天气）"
dynamic = [
  "dependencies",
  "optional-dependencies",
  "version",
]
keywords = [
  "Natural Gas Forecast",
  "Weather Forecast",
  "Large Language Models",
  "Autonomous Agents",
]
name = "quantaalpha"
requires-python = ">=3.10"

[project.scripts]
quantaalpha = "quantaalpha.cli:app"

[project.urls]
homepage = "https://github.com/QuantaAlpha/quantaalpha"
issue = "https://github.com/QuantaAlpha/quantaalpha/issues"

[tool.setuptools]
packages = {find = {where = ["."]}}

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.dynamic.optional-dependencies]
forecast = {file = ["requirements/forecast.txt"]}
forecast-all = {file = ["requirements/forecast-all.txt"]}
weather = {file = ["requirements/weather.txt"]}

[tool.setuptools_scm]
local_scheme = "no-local-version"
version_scheme = "guess-next-dev"
